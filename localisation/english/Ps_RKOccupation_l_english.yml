l_english: 

rkoccupation.1.d:0 "After a hard-fought campaign, Belgium and northern France have finally fallen. The last pockets of resistance have been crushed by our victorious forces. With the Low Countries secured, the time has come to decide their fate: establish Reichskommissariat Belgien-Nordfrankreich or seek another solution."
rkoccupation.2.d:0 "The Baltic nations and Belarus have been brought to heel after fierce fighting. Our troops now march through Riga, Tallinn and Minsk. The eastern front lines are stabilized. We must now decide whether to create Reichskommissariat Ostland or find another path."
rkoccupation.3.d:0 "After brutal combat in the mountains and passes of the Caucasus, the region has fallen. The vital oil fields are now in German hands. Our soldiers stand victorious, but the local populations remain hostile. We must decide the future of Reichskommissariat Kaukasien."
rkoccupation.4.d:0 "The endless steppes of Central Asia have been conquered. Our forces have triumphed over harsh terrain and determined resistance. With Turkestan under our control, we now face the decision of whether to establish Reichskommissariat Turkestan or pursue a different administration."
rkoccupation.5.d:0 "The Iberian Peninsula has been subdued after heavy fighting. Spanish and Portuguese forces have been defeated, and our troops now control Madrid and Lisbon. The time has come to decide the fate of Reichskommissariat Iberien."
rkoccupation.6.d:0 "From the Danube to the Adriatic, the Balkans have fallen to German arms. Belgrade, Sofia and Bucharest fly the German flag. With the region secured, we must now decide whether to create a unified Reichskommissariat Balkan."
rkoccupation.7.d:0 "The Czech lands have been completely occupied. Bohemia and Moravia, with their important industrial capacity, now await our decision. Shall we establish the Reichsprotektorat Bohemia-Moravia or seek another path?"
rkoccupation.8.d:0 "Much of northern South America lies conquered. Our troops have triumphed in the jungles and cities of Brazil and its neighbors. The rich resources of this continent await proper organization under Reichskommissariat Klein-Venedig."
rkoccupation.9.d:0 "The high peaks of the Andes have been brought under German control after difficult mountain warfare. Chile, Argentina and their neighbors have fallen. A decision on Reichskommissariat Anden is now required."
rkoccupation.10.d:0 "Central America and the Caribbean have been secured after intense fighting. From Mexico City to Havana, German forces stand victorious. We must now decide the fate of Reichskommissariat Kolumbus."
rkoccupation.11.d:0 "The United States and Canada have been decisively defeated. After years of struggle, the industrial heart of North America belongs to the Reich. Our forces march through Washington and Ottawa. The hour has come to establish Reichskommissariat Nordamerika."
rkoccupation.12.d:0 "From the shores of the Mediterranean to the Arabian desert, the Middle East has fallen under German control. The oil wells burn for the Reich. We must now decide the administration of Reichskommissariat Arabien."
rkoccupation.13.d:0 "The Indian subcontinent, with its vast population and resources, has been conquered. Our troops stand victorious from Kabul to Calcutta. The creation of Reichskommissariat Hindustan must now be considered."
rkoccupation.14.d:0 "East Asia has been brought to its knees. From the ruins of Beijing to the jungles of Indochina, German arms have triumphed. The future of Reichskommissariat Ostasien lies before us."
rkoccupation.15.d:0 "Australia, New Zealand and the East Indies have fallen after naval and land campaigns. Our forces now control the southern seas. The time has come to establish Reichskommissariat Australasien."
rkoccupation.16.d:0 "North Africa from Morocco to Libya has been secured. The Mediterranean coast and the path to central Africa lie open. A decision regarding Reichskommissariat Nordafrika is now necessary."
rkoccupation.17.d:0 "The heart of Africa has been conquered after grueling campaigns across jungle and savanna. Vast resources and territories are now in our hands. We must decide the fate of Reichskommissariat Mittelafrika."
rkoccupation.18.d:0 "After hard fighting in the fjords and mountains, Norway has fallen. Our troops march through Oslo. Controlling this vast but sparsely populated land will be a challenge, yet the time has come to decide the fate of Reichskommissariat Norwegen."
rkoccupation.19.d:0 "The Netherlands have been completely subdued. Rotterdam and Amsterdam are under German control. This wealthy and strategically vital country must now be organized as Reichskommissariat Niederlande."
rkoccupation.20.d:0 "Ukraine, the breadbasket of Europe, has been secured after ferocious battles. Our soldiers stand victorious across its endless fields. The decision to establish Reichskommissariat Ukraine can no longer be delayed."
rkoccupation.21.d:0 "After a hard struggle against Polish forces, Poland has once again been brought to its knees. Warsaw has fallen. We must now decide whether to erase the Polish state created after the Great War or administer it through the Generalgouvernement."
rkoccupation.22.d:0 "The central lands of the former Soviet Union lie defeated. Moscow itself has fallen to German arms. The time has come to decide the fate of Reichskommissariat Moskowien."
rkoccupation.23.d:0 "The once-mighty British Empire has been broken. London has fallen and the British Isles are under German occupation. We must now decide the future of Reichskommissariat Grossbritannien."
id.settlement.14.t: "The fate of [FROM.GetNameDefCap]"
id.settlement.14.d: "We have established an administration for [FROM.GetNameDef]. We must decide whether to organize the territory as a Reichskommissariat or maintain it as a simple protectorate."
id.settlement.14.a: "Establish a Reichskommissariat."
id.settlement.14.b: "Maintain it as a protectorate."